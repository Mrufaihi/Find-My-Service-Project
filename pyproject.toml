[tool.black]
line-length = 88
target-version = ['py310']
include = '\.pyi?$'
exclude = '''
(
  /(
    \.git
    | \.venv
    | venv
    | migrations
  )/
)
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
include_trailing_comma = true

[tool.djlint]
profile = "django"
ignore = "H031"
indent = 2
use_spaces = true
blank_line_after_tag = "load,extends,include"
format_css = true
format_js = true 